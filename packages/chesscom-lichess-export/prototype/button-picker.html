<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess.com → Lichess — button picker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1a1a18;
      color: #e8e6e3;
      padding: 24px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: #9a9893; font-size: 0.9rem; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .card:hover { transform: translateY(-1px); }
    .card.selected {
      border-color: #81b64c;
      box-shadow: 0 0 0 1px #81b64c;
    }
    .card-head {
      padding: 10px 14px;
      background: #2a2926;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-head code {
      font-size: 0.75rem;
      color: #c5a86a;
      font-weight: 500;
    }
    .pane {
      padding: 20px 16px 24px;
    }
    .pane-dark {
      background: hsl(37 10% 8%);
    }
    .pane-light {
      background: hsl(37 12% 96.5%);
      border-top: 1px solid #ddd;
    }
    .pane-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.55;
      margin-bottom: 12px;
    }
    .pane-light .pane-label { color: #555; }
    .mock-review {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      background: #5fa535;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      opacity: 0.85;
    }
    .cc2l-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 1.3rem 2rem;
      margin-top: 8px;
      border: none;
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
      box-sizing: border-box;
      font-family: inherit;
    }
    .cc2l-btn svg { width: 24px; height: 24px; flex-shrink: 0; }
    .cc2l-share {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 12px;
      padding: 12px 16px;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .cc2l-share svg { width: 20px; height: 20px; }
    .mock-dl {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #5fa535;
      color: #fff;
      font-weight: 600;
      opacity: 0.7;
    }
    #pick {
      position: sticky;
      bottom: 0;
      margin-top: 24px;
      padding: 16px 20px;
      background: #2a2926;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 1rem;
    }
    #pick strong { color: #e8b84a; }
  </style>
</head>
<body>
  <h1>Button picker — Chess.com → Lichess</h1>
  <p class="sub">Click a card to select. Reply in chat with the code (e.g. <strong>1a</strong>). Dark pane = chess.com sidebar/modal; light = lichess light chrome.</p>

  <div class="grid" id="grid"></div>
  <div id="pick">Selected: <strong>none</strong> — click a card</div>

  <script>
    const LOGO = `<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="m37.656 74.009c-4.8354-0.36436-9.6886-1.699-13.955-3.8378-3.4383-1.7236-6.4517-3.92-9.0933-6.628-7.0896-7.2676-10.055-17.334-8.1548-27.684 1.5646-8.5227 6.1202-15.614 12.927-20.122 6.4164-4.2497 14.836-6.2637 24.632-5.8922l2.1764 0.082493 0.71448-0.46162c2.8371-1.8331 5.781-2.7675 10.74-3.409 1.3469-0.17424 1.5334-0.18309 1.7288-0.082031 0.24019 0.1242 0.31608 0.26074 0.31608 0.56864 0 0.11136-0.4595 2.1736-1.0211 4.5828-1.0078 4.3233-1.0194 4.3838-0.89332 4.6483 0.07031 0.14737 0.50749 0.95627 0.97159 1.7975 0.4641 0.84128 0.96793 1.7581 1.1196 2.0374 0.15171 0.2793 1.5664 2.8457 3.1439 5.7031 1.5774 2.8574 3.8363 6.9531 5.0198 9.1016 3.237 5.8763 4.9952 9.0631 5.4255 9.8339 0.50792 0.90969 0.63287 1.4871 0.62769 2.9005-0.0037 0.91614-0.03691 1.2203-0.20664 1.8732-0.86524 3.328-3.915 6.1562-8.8068 8.167-1.1079 0.45544-2.3332 0.85827-2.6106 0.85827-0.25397 0-0.38898-0.15415-1.129-1.2891-1.3352-2.0478-3.9112-4.9986-6.541-7.4929-1.5045-1.427-2.0154-1.8499-5.6466-4.6744-4.6142-3.5891-6.2759-5.0009-8.48-7.2045-3.9949-3.9941-5.887-7.2765-6.1716-10.706-0.08995-1.0838 0.18839-2.7981 0.50585-3.1155 0.41619-0.41619 1.1662-0.01476 1.064 0.56953-0.02694 0.15422-0.06902 0.65348-0.09347 1.1095-0.03663 0.68284-0.01606 0.94126 0.11629 1.4648 0.63768 2.5217 3.041 5.405 7.3949 8.8718 2.0126 1.6025 3.381 2.5855 7.6172 5.4717 5.194 3.5387 5.6984 3.9377 8.1641 6.4574 2.308 2.3586 3.494 3.8269 4.3474 5.3817 0.22404 0.4082 0.4147 0.75294 0.42366 0.7661 0.03949 0.05785 1.0174-0.24498 1.6091-0.49822 2.5156-1.0767 4.1441-3.2328 4.6375-6.1402l0.12817-0.75512-2.3219-3.8933c-1.2771-2.1413-2.9627-4.9656-3.7459-6.2761-2.1258-3.5573-10.258-17.183-10.81-18.114-0.26416-0.44496-0.4989-0.88442-0.52166-0.97656-0.0251-0.10167 0.35524-1.304 0.96742-3.0582 1.1589-3.3208 1.1586-3.0658 0.0028-2.7713-1.7885 0.45585-3.5267 1.2861-7.057 3.3706-0.71397 0.4216-1.2524 0.68973-1.385 0.68973-0.11934 0-0.6484-0.06957-1.1757-0.15451-2.4739-0.39872-5.0621-0.55615-7.5603-0.45987-5.5228 0.21286-10.604 1.8776-14.844 4.8634-4.762 3.3535-8.8329 8.8527-10.751 14.524-2.991 8.8413-0.68144 19.066 6.03 26.696 4.991 5.6739 11.828 9.2927 19.487 10.315 1.578 0.21053 4.5386 0.28823 6.1195 0.16059 7.0509-0.56924 13.253-3.3262 18.267-8.1207 0.79159-0.75686 0.94438-0.87009 1.174-0.87009 0.61003 0 0.83436 0.48111 0.49462 1.0608-0.76303 1.302-2.9045 3.6393-4.5382 4.9532-4.0237 3.236-9.0858 5.1841-14.924 5.7434-1.1092 0.10625-4.5728 0.1453-5.655 0.06376z"/></svg>`;

    const variants = [
      {
        id: '1a',
        name: 'Brag solid (current v0.1.5)',
        desc: 'lila --c-brag',
        main: {
          background: 'hsl(37 74% 43%)',
          color: '#fff',
          borderRadius: '3px',
          textShadow: '0.5px 0.5px 0 rgb(0 0 0 / 0.5)',
          boxShadow: '0 2px 4px 0 hsl(0 0% 0% / 0.225)',
        },
        share: 'same',
      },
      {
        id: '1b',
        name: 'Accent solid',
        desc: 'lila --c-accent (stronger orange)',
        main: {
          background: 'hsl(22 100% 42%)',
          color: '#fff',
          borderRadius: '3px',
          textShadow: '0.5px 0.5px 0 rgb(0 0 0 / 0.5)',
          boxShadow: '0 2px 4px 0 hsl(0 0% 0% / 0.225)',
        },
        share: 'same',
      },
      {
        id: '1c',
        name: 'Brag outline',
        desc: 'dark fill + orange border',
        main: {
          background: 'hsl(37 10% 12%)',
          color: 'hsl(37 100% 70%)',
          border: '2px solid hsl(37 74% 43%)',
          borderRadius: '3px',
          boxShadow: 'none',
          textShadow: 'none',
        },
        share: {
          background: 'transparent',
          color: 'hsl(37 74% 43%)',
          border: '2px dashed hsl(37 74% 43%)',
          borderRadius: '3px',
          boxShadow: 'none',
          textShadow: 'none',
        },
      },
      {
        id: '1d',
        name: 'Invictus orange',
        desc: '#d64f00 reference',
        main: {
          background: '#d64f00',
          color: '#fff',
          borderRadius: '0.5em',
          fontWeight: '600',
          boxShadow: 'none',
          textShadow: 'none',
        },
        share: 'same',
      },
      {
        id: '1e',
        name: 'Brag + 7px round',
        desc: 'lichess roundness slider',
        main: {
          background: 'hsl(37 74% 43%)',
          color: '#fff',
          borderRadius: '7px',
          textShadow: '0.5px 0.5px 0 rgb(0 0 0 / 0.5)',
          boxShadow: '0 2px 4px 0 hsl(0 0% 0% / 0.225)',
        },
        share: 'same',
      },
      {
        id: '1f',
        name: 'Metal + brag text',
        desc: 'lichess header metal gradient',
        main: {
          background: 'linear-gradient(to bottom, hsl(37 7% 22%), hsl(37 5% 19%))',
          color: 'hsl(37 100% 70%)',
          border: '1px solid hsl(0 0% 25%)',
          borderRadius: '3px',
          boxShadow: '0 1px 3px 0 hsl(0 0% 0% / 0.2)',
          textShadow: 'none',
        },
        share: 'same',
      },
    ];

    function styleStr(obj) {
      return Object.entries(obj)
        .map(([k, v]) => `${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}: ${v}`)
        .join('; ');
    }

    function btnHtml(cls, label, style) {
      return `<button type="button" class="${cls}" style="${styleStr(style)}">${LOGO} ${label}</button>`;
    }

    const grid = document.getElementById('grid');
    const pick = document.getElementById('pick');

    variants.forEach((v) => {
      const shareStyle = v.share === 'same' ? { ...v.main, fontSize: undefined } : v.share;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = v.id;
      card.innerHTML = `
        <div class="card-head">${v.name} <code>${v.id}</code></div>
        <div class="pane pane-dark">
          <div class="pane-label">chess.com (dark)</div>
          <button type="button" class="mock-review" disabled>★ Game Review</button>
          ${btnHtml('cc2l-btn', 'Analyse on Lichess', v.main)}
        </div>
        <div class="pane pane-light">
          <div class="pane-label">share modal context</div>
          ${btnHtml('cc2l-share', 'Export to Lichess', shareStyle)}
          <button type="button" class="mock-dl" disabled>↓ Download</button>
        </div>
        <div class="pane pane-dark" style="padding-top:8px;font-size:0.8rem;color:#888">${v.desc}</div>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.card').forEach((c) => c.classList.remove('selected'));
        card.classList.add('selected');
        pick.innerHTML = `Selected: <strong>${v.id}</strong> — ${v.name}. Reply <strong>${v.id}</strong> in chat.`;
      });
      grid.appendChild(card);
    });

    document.querySelector('.card')?.classList.add('selected');
    pick.innerHTML = 'Selected: <strong>1a</strong> — Brag solid (current v0.1.5). Reply <strong>1a</strong> in chat.';
  </script>
</body>
</html>
